<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#6f9c86">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudentOS</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fffdf9;--ink:#2b2f2c;--mute:#7d837e;--line:#e6e2d8;--g:#8fbf9f;--y:#e8c872;--r:#e29a8c;--ac:#6f9c86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c201e;--card:#252a27;--ink:#e9ece8;--mute:#98a09a;--line:#343b37;--g:#6fa282;--y:#c9a957;--r:#c77d6f;--ac:#8fbfa5}}
:root[data-theme="dark"]{--bg:#1c201e;--card:#252a27;--ink:#e9ece8;--mute:#98a09a;--line:#343b37;--g:#6fa282;--y:#c9a957;--r:#c77d6f;--ac:#8fbfa5}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Heebo,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 20px 80px}
h1,h2{font-family:"Frank Ruhl Libre",serif;margin:0}
h1{font-size:34px;line-height:1.2}
h2{font-size:21px;margin:40px 0 12px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{color:var(--mute);margin-top:4px}
button,input,select{font:inherit;color:inherit}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--mute)}
.ghost:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.lesson{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.lesson time{color:var(--mute);width:48px;flex:none;direction:ltr;text-align:right}
.task{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.bar{width:6px;border-radius:6px;flex:none}
.task b{font-weight:500;font-size:18px}
.meta{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink)}
form{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
label{font-size:14px;color:var(--mute);display:block}
.hint{font-size:13px;color:var(--ac)}
.empty{color:var(--mute);padding:12px 0}
.focus .task{padding:28px}
.setup{margin-top:48px}.setup summary{display:inline-block;list-style:none;cursor:pointer}
.setup .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;display:grid;gap:10px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;color:inherit;resize:vertical}
.ev{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--mute);cursor:pointer}
[hidden]{display:none!important}
.trk{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:4px 0 10px}.trk i{display:block;height:100%}
#pom{align-items:center;justify-content:space-between;margin-bottom:12px}.big{font:700 28px "Frank Ruhl Libre",serif;direction:ltr}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}

body{background:radial-gradient(1000px 420px at 50% -180px,color-mix(in srgb,var(--ac) 24%,transparent),transparent),var(--bg)}
h1{font-family:Heebo,sans-serif;font-weight:700;font-size:30px;letter-spacing:-.02em}
h2{font-family:Heebo,sans-serif;font-weight:500;font-size:14px;color:var(--mute);margin:30px 0 10px;letter-spacing:.02em}
.task{border:0;border-radius:20px;box-shadow:0 1px 2px #0000000d,0 10px 26px -14px #00000040}
#tasks .task:first-child{padding:22px}#tasks .task:first-child b{font-size:21px}
.lesson{background:var(--card);border:0;border-radius:14px;padding:12px 16px;margin-bottom:8px;align-items:center}
.lesson time{font-weight:500;color:var(--ac)}
.btn,.ghost,.chip{border-radius:999px}
form,.setup .box{border:0;border-radius:20px;box-shadow:0 1px 2px #0000000d,0 10px 26px -14px #00000040}
#addsec{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;z-index:20;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -16px 48px #0004;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;transform:translateY(110%);transition:transform .25s ease}
#addsec.open{transform:none}
#addsec h2{margin-top:6px}
#addsec form{box-shadow:none;padding:0;background:none}
#fab{position:fixed;left:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:15;width:60px;height:60px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;line-height:1;box-shadow:0 10px 28px -6px #0006;cursor:pointer}
main{padding-bottom:120px}

.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dy{flex:none;width:54px;padding:8px 0;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:center;cursor:pointer;scroll-snap-align:start;line-height:1.25}
.dy small{display:block;color:var(--mute);font-size:12px}.dy b{font-size:18px;font-weight:500}
.dy[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}.dy[aria-pressed="true"] small{color:#ffffffcc}
.tp{display:flex;align-items:center;gap:6px}.tp select{flex:1;width:auto}
dialog{border:0;border-radius:24px;padding:22px;background:var(--bg);color:var(--ink);width:min(92vw,420px)}
dialog::backdrop{background:#0006;backdrop-filter:blur(3px)}

html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100dvh;touch-action:manipulation}
#addsec{max-height:90dvh}
#dmore{position:relative;overflow:hidden;display:grid;place-items:center;padding:10px;font-size:15px;border-radius:12px}
.lesson.off{opacity:.7}.lesson s{color:var(--mute)}
.lesson time small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.tag{margin-inline-start:auto;font-style:normal;font-size:12px;color:var(--r);border:1px solid var(--r);border-radius:999px;padding:1px 10px}
.arr{color:var(--ac)}.brk{color:var(--mute);font-size:13px;padding:2px 16px 8px}
#snk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;display:flex;gap:16px;align-items:center;box-shadow:0 10px 30px #0005;white-space:nowrap}
#snk button{background:none;border:0;color:var(--ac);font-weight:700;cursor:pointer;padding:0}

.vh{position:absolute;inset:0;opacity:0;pointer-events:none;width:100%;height:100%}
#dmore{width:100%}
#cal{display:none}
body.calmode #cal{display:block}
body.calmode #pbn,body.calmode #sched,body.calmode #evsec,body.calmode #pom,body.calmode #tasksec,body.calmode .setup,body.calmode #clear{display:none!important}
.cct{display:grid;gap:10px;margin:18px 0 10px}
.cseg{display:flex;gap:6px;flex-wrap:wrap}
.cn{display:flex;align-items:center;gap:8px}.cn b{flex:1;text-align:center;font-weight:500}
.cg{--n:3}
.ghd{display:grid;grid-template-columns:34px repeat(var(--n),minmax(0,1fr))}
.ch{background:none;border:0;cursor:pointer;padding:6px 0;text-align:center;line-height:1.2;font:inherit;color:inherit}
.ch small{display:block;color:var(--mute);font-size:12px}.ch b{font-size:17px;font-weight:500}
.ch.td b{background:var(--ac);color:#fff;border-radius:50%;display:inline-grid;place-items:center;width:28px;height:28px}
.ad{padding:2px;display:grid;gap:2px;align-content:start}
.evc{font-size:10px;background:color-mix(in srgb,var(--y) 40%,var(--card));border-radius:6px;padding:1px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gbd{margin-top:6px}
.gut{position:relative;font-size:10px;color:var(--mute)}.gut span{position:absolute;right:0;transform:translateY(-7px)}
.col{position:relative;border-inline-start:1px solid var(--line)}
.col i{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
.blk{position:absolute;inset-inline:2px;background:color-mix(in srgb,var(--ac) 22%,var(--card));border-radius:8px;padding:2px 5px;overflow:hidden;font-size:11px;line-height:1.25;border-inline-start:3px solid var(--ac)}
.blk b{font-weight:500;display:block}.blk span{color:var(--mute);display:block}
.blk.off{background:transparent;border:1px dashed var(--r);opacity:.85}.blk.chg{border-inline-start-color:var(--y)}
.dd{position:absolute;inset-inline:2px;height:20px;border-radius:6px;font-size:10px;padding:2px 5px;color:#1b1f1c;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2;box-shadow:0 2px 6px #0003}
.nl{position:absolute;left:0;right:0;border-top:2px solid var(--r);z-index:3}
.mh,.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh span{text-align:center;color:var(--mute);font-size:12px;padding-bottom:4px}
.mc{aspect-ratio:1;border:0;border-radius:12px;background:var(--card);cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:inherit}
.mc b{font-weight:500}.mc.dim{opacity:.4}.mc.td{outline:2px solid var(--ac)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}.dots i{width:6px;height:6px;border-radius:50%}

.offbar{background:color-mix(in srgb,var(--ac) 38%,var(--card));min-height:16px}
.col.offc{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--ac) 9%,transparent) 8px 16px)}
.mc.moff{background:color-mix(in srgb,var(--ac) 30%,var(--card))}
.vac{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 28%,var(--card)),var(--card));border-radius:16px;padding:22px 18px;text-align:center}
.vac b{display:block;font-size:20px;font-weight:500;margin-bottom:6px}.vac .meta{margin-top:4px}
.sday{background:color-mix(in srgb,var(--y) 28%,var(--card));border-radius:14px;padding:12px 16px;margin-bottom:10px}.sday b{font-weight:500}
input[type=checkbox]{width:auto;accent-color:var(--ac)}
.chk{display:flex;align-items:center;gap:8px}
#prv{display:grid;gap:8px}
.prl{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 10px}
.prl label{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.gauge{position:relative;height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.gauge b{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.gauge u{position:absolute;inset-block:0;width:2px;background:var(--bg);text-decoration:none}
.gl{position:relative;height:16px;font-size:11px;color:var(--mute)}.gl span{position:absolute;transform:translateX(50%)}
.att-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.att-row input{text-align:center}
.spt{font-size:16px;font-weight:500;margin:18px 0 8px;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.attbig{font-size:34px;font-weight:500;display:flex;align-items:center;gap:10px;margin-top:14px}.attbig i{width:14px;height:14px;border-radius:50%;display:inline-block}
.atm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;line-height:1.5}
.lesson[data-sub]{cursor:pointer}
body.subjmode main>:not(#spage),body.subjmode #fab,body.subjmode #clear{display:none!important}
body.profmode main>:not(#ppage),body.profmode #fab,body.profmode #clear{display:none!important}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:16px}.ov small{display:block;color:var(--mute);font-size:12px}.ov b{font-weight:500;font-size:18px}
.dotu{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:8px}
.oc{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.oc:last-child{border:0}.oc .ktag{flex:none;margin-top:2px}
.t-good{background:var(--g);color:#1b1f1c}.t-warn{background:var(--y);color:#1b1f1c}.t-next{background:var(--ac);color:#fff}
.hab{padding:10px 0;border-bottom:1px solid var(--line)}.hab:last-child{border:0}.hh{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.srow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;color:inherit;font:inherit;cursor:pointer}.srow:last-child{border:0}.srow>span:nth-child(2){flex:1}
.scl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.scl button,.dfc button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 0;color:var(--ink);font:inherit;cursor:pointer}
.scl button.on,.dfc button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sce{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:4px}
.dfc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.dfc button{padding:8px 14px;border-radius:999px}
.fq{margin-top:16px;color:var(--ink)}
.sph{font-size:30px;margin:14px 0 2px}.spc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}.spc .spt{margin-top:0}
.kc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:14px;padding:12px 16px;margin-bottom:10px;background:color-mix(in srgb,var(--kcol,var(--y)) 30%,var(--card))}
.kc b{font-weight:500}.kc.k-day{padding:18px 16px}.kc.k-day b{font-size:18px}
.k-activity{--kcol:#b9a8e0}.k-day{--kcol:#efb98f}
.kc.k-exam,.kc.k-quiz,.kc.k-mock{background:var(--card);border:2px solid var(--ink)}.kc.k-quiz{border-width:1px;border-style:dashed}.kc.k-mock{border-color:var(--ac)}
.ktag{font-size:12px;border-radius:999px;padding:2px 10px;font-style:normal;background:var(--ink);color:var(--bg);white-space:nowrap}
.t-quiz{background:none;color:var(--ink);border:1px solid var(--ink)}.t-mock{background:var(--ac);color:#fff}.t-activity{background:#b9a8e0;color:#1b1f1c}.t-day{background:#efb98f;color:#1b1f1c}
.lesson.k-activity{background:color-mix(in srgb,#b9a8e0 35%,var(--card))}
.lesson.k-exam,.lesson.k-quiz,.lesson.k-mock{border:2px solid var(--ink)}.lesson.k-quiz{border-width:1px;border-style:dashed}.lesson.k-mock{border-color:var(--ac)}
.lesson>span{flex:1}
.eve{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--ac) 18%,var(--card));border-radius:14px;padding:10px 14px;margin-bottom:10px}.eve b{font-weight:500}
.blk.sp{background:color-mix(in srgb,#b9a8e0 40%,var(--card));border-inline-start-color:#b9a8e0}.blk.ex{border:2px solid var(--ink)}
.evc.k-activity{background:color-mix(in srgb,#b9a8e0 45%,var(--card))}.evc.k-day{background:color-mix(in srgb,#efb98f 50%,var(--card))}
.evc.k-exam,.evc.k-quiz,.evc.k-mock{background:var(--card);outline:1.5px solid var(--ink);font-weight:500}
.prl select{width:auto;max-width:48%}
.mc.sm{aspect-ratio:auto;padding:9px 0;border-radius:10px}.mc.sel{background:var(--ac);color:#fff}.mc:disabled{opacity:.3;cursor:default}
#mp{background:var(--card);border-radius:16px;padding:10px;display:grid;gap:8px}
.ev.edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0}
.ev .x{font-size:18px;padding:2px 6px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<main>
<header>
  <div><h1 id="hello">היום</h1><div class="date" id="date"></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
    <button class="ghost" id="profb">פרופיל</button>
    <button class="ghost" id="calb">יומן</button>
    <button class="ghost" id="clear">מצב ריכוז</button>
    <button class="ghost" id="theme">כהה/בהיר</button>
  </div>
</header>
<section id="fbc" class="spc" hidden></section>
<section id="cal">
  <div class="cct"><div class="cseg" id="cseg"></div>
    <div class="cn"><button class="ghost" id="cp" aria-label="הקודם">›</button><b id="cti"></b><button class="ghost" id="cnx" aria-label="הבא">‹</button><button class="ghost" id="ctd">היום</button></div></div>
  <div id="cbody"></div>
</section>

<div id="pbn" class="task" hidden></div>
<section id="sched">
  <h2>המערכת של היום</h2>
  <div class="eve" id="eve" hidden></div>
  <div id="lessons"></div>
</section>

<section id="evsec" hidden><h2>בקרוב</h2><div id="ev"></div></section>

<div id="pom" class="task" hidden></div>
<section id="tasksec">
  <h2 id="th">שלוש המשימות הבוערות</h2>
  <div id="tasks"></div>
</section>

<section id="addsec"><button class="x" id="cx" type="button" aria-label="סגור" style="float:left;font-size:22px">×</button>
  <h2 id="fh">משימה חדשה</h2>
  <form id="f">
    <input id="n" required placeholder="שם המשימה" aria-label="שם המשימה" autocomplete="off">
    <div class="two" style="grid-template-columns:2fr 1fr">
      <input id="s" list="subs" required placeholder="מקצוע" aria-label="מקצוע" autocomplete="off"><datalist id="subs"></datalist>
      <input id="e" type="number" min="5" step="5" value="30" required aria-label="דקות משוערות" placeholder="דקות">
    </div>
    <div class="hint" id="sug"></div>
    <div class="strip" id="dc"></div>
    <div class="two">
      <input id="tmx" inputmode="numeric" placeholder="שעה, למשל 08:30" aria-label="שעה" maxlength="5" autocomplete="off">
      <button type="button" class="chip" id="dmore">תאריך אחר</button>
    </div>
    <div id="mp" hidden></div>
    <input id="d" type="hidden"><input id="tm" type="hidden">
    <div class="hint" id="dh"></div>
    <button class="btn" type="submit" id="fs">הוסף משימה</button>
  </form>
</section>

<details class="setup" id="st"><summary class="ghost">מערכת ואירועים</summary>
  <div class="box">
    <div><label for="nmn">איך לקרוא לך?</label><input id="nmn" autocomplete="given-name" maxlength="20" placeholder="השם שלך"></div>
    <div><label for="cls">כיתה</label><input id="cls" placeholder="יא - 1" list="clsl" autocomplete="off"><datalist id="clsl"></datalist></div>
    <button class="btn" type="button" id="sy">סנכרן מערכת מבית הספר</button>
    <div class="hint" id="sym"></div>
    <div id="pick"></div>
    <div><label for="dy">מערכת השעות ליום</label><select id="dy"></select></div>
    <textarea id="lt" rows="5" placeholder="שורה לכל שיעור:&#10;08:00 מתמטיקה&#10;09:45 אנגלית"></textarea>
    <button class="btn" type="button" id="ss">שמור יום</button>
    <div class="hint" id="sm"></div>
  </div>
  <div class="box">
    <div><label for="pdf">אירועי השנה (PDF)</label><input id="pdf" type="file" accept="application/pdf"></div>
    <textarea id="pt" rows="5" placeholder="או הדביקו כאן טקסט, שורה לכל אירוע:&#10;12.10 חופש סוכות&#10;3/11 מבחן במתמטיקה"></textarea>

function today0(){const d=new Date();d.setHours(0,0,0,0);return d}
// ---- school-day engine: which dates have no lessons ----
var offMap={},pend=[];
var SCH_K=['צום','תענית','זיכרון','רבין','צהוב','שיא','טקס','ערב','מבחן','בוחן','מבדק','מתכונת','בגרות','טיול','הרצאה','יום הולדת'];

var OFF_K=['חופש','סוכות','שמחת תורה','שמיני עצרת','ראש השנה','יום כיפור','פסח','שבועות','חנוכה','פורים','עצמאות','שבת','אין לימודים','חול המועד','אסרו חג'];
function hasK(t,a){return a.some(k=>t.includes(k))}

function classify(title){

var KINDS={info:'אירוע',off:'אין לימודים',day:'יום שכבתי / טיול',activity:'הרצאה / פעילות',exam:'מבחן',quiz:'מבדק',mock:'מתכונת'};

function kindOf(e){if(e.kind&&KINDS[e.kind])return e.kind;if(e.off===true)return 'off';const k=classifyKind(e.title);return k==='off'?'info':k}

function hasLes(wd){return week&&week.lessons&&week.lessons.length?week.lessons.some(l=>l.day===wd):(sched[wd]||[]).length>0}
function isQuiet(d){const w=d.getDay();return w===6||(w===5&&!hasLes(5))}
function buildOff(){offMap={};evs.forEach(e=>{if(isOff(e)&&!offMap[e.date])offMap[e.date]=e.title})}
function offStep(x,dir){let y=addD(x,dir),k=0;while(!offMap[iso(y)]&&isQuiet(y)&&k<3){y=addD(y,dir);k++}return offMap[iso(y)]?y:null}
// a vacation run: consecutive off days; a Friday/Saturday between two off days belongs to the run
function offInfo(d){
  const own=offMap[iso(d)];
  if(!own&&!(isQuiet(d)&&offStep(d,-1)&&offStep(d,1)))return null;
  let a=new Date(d),b=new Date(d),n;
  for(let i=0;i<90&&(n=offStep(a,-1));i++)a=n;
  for(let i=0;i<90&&(n=offStep(b,1));i++)b=n;
  return {a,b,title:own||offMap[iso(a)]};
}

function offList(){buildOff();const t=iso(addD(new Date(),-1)),o={};Object.keys(offMap).sort().filter(k=>k>=t).slice(0,150).forEach(k=>o[k]=offMap[k]);return o}
function vacHTML(d){

// Accepts one date per line (as Gemini writes them), ranges (12.10-19.10) and ISO dates.
function parseEvents(txt){
  const n=new Date(),y0=n.getMonth()>=8?n.getFullYear():n.getFullYear()-1;let out=[];
  const P='(\\d{1,2})[./](\\d{1,2})(?:[./](\\d{2,4}))?';
  const RG=new RegExp(P+'\\s*[-–—]\\s*'+P),ONE=new RegExp(P),ISO=/(\d{4})-(\d{2})-(\d{2})/;
  const yr=(mm,yy)=>yy?(+yy<100?2000+ +yy:+yy):(mm>=9?y0:y0+1);
  const ok=(d,m)=>d>=1&&d<=31&&m>=1&&m<=12;
  const strip=x=>x.replace(/\s+/g,' ').replace(/^[\s\-–—:,.|•*>]+|[\s\-–—:,.|•*]+$/g,'').trim();
  txt.split('\n').forEach(l=>{
    l=l.replace(/^\s*(\d{1,3}[.)]\s+|[-*•]\s+)/,'');
    let m,dates=[],rest=l;
    if((m=l.match(ISO))&&ok(+m[3],+m[2])){dates=[m[0]];rest=l.replace(m[0],'')}
    else if((m=l.match(RG))&&ok(+m[1],+m[2])&&ok(+m[4],+m[5])){
      let a=new Date(yr(+m[2],m[3]),+m[2]-1,+m[1]),yb=yr(+m[5],m[6]),b=new Date(yb,+m[5]-1,+m[4]);
      if(b<a&&!m[6])b=new Date(yb+1,+m[5]-1,+m[4]);
      for(let k=0;k<45&&a<=b;k++){dates.push(iso(a));a=addD(a,1)}
      rest=l.replace(m[0],'');
    }else if((m=l.match(ONE))&&ok(+m[1],+m[2])){dates=[yr(+m[2],m[3])+'-'+pad(+m[2])+'-'+pad(+m[1])];rest=l.replace(m[0],'')}
    const title=strip(rest);if(!dates.length||!title)return;
    dates.forEach(date=>out.push({date,title}));
  });
  return out;
}

function b64(k){const p='='.repeat((4-k.length%4)%4),r=atob((k+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function subscribePush(){

    if(!key)return;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key)});
    cfg.push=true;store.set('so_cfg',cfg);pushSync(0);
  }catch(e){cfg.push=false}
}
async function unsubPush(){

    const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){await fetch('/api/subscribe',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe()}
  }catch(e){}
}

function streakN(){let n=0,d=new Date();if(!days[iso(d)])d.setDate(d.getDate()-1);while(days[iso(d)]){n++;d.setDate(d.getDate()-1)}return n}
function subStats(sub){

  const ratio=dn.length?dn.reduce((x,t)=>x+t.act/t.est,0)/dn.length:null;

function profSubjects(){

function profBuild(){
  const cl=x=>Math.min(1,Math.max(0,x)),dn=tasks.filter(t=>t.done&&t.act&&t.est&&!t.del);
  const subs=profSubjects(),sig=[];
  const rs=dn.map(t=>t.act/t.est),mr=rs.length>=2?rs.reduce((a,b)=>a+b,0)/rs.length:null;

    txt:mr===null?'אחרי כמה משימות שהושלמו, נדע כמה זמן באמת לוקחות לך משימות.':`משימות לוקחות לך בממוצע פי ${mr.toFixed(1)} מהמתוכנן. ${mr>1.15?'כדאי להעריך יותר זמן מראש.':mr<0.85?'אתה מסיים מהר מהצפוי.':'ההערכות שלך מדויקות מאוד.'}`});

  const hd=grades.filter(g=>g.f==='קשה').length;
  sig.push({name:'תחושת קושי',v:grades.length?1-hd/grades.length:null,txt:grades.length?`${hd} מתוך ${grades.length} מבחנים ומטלות הרגישו לך קשים.`:'כשתסמן איך הרגיש כל ציון, נראה איפה הקושי מרוכז.'});

function isExamEv(e){return !isOff(e)&&['exam','quiz','mock'].includes(kindOf(e))}

// patterns from the answers; needs a few exams before it claims anything
function fbInsights(){
  const a=fb.filter(f=>!f.skip);if(!a.length)return null;
  const avg=(arr,k)=>arr.reduce((x,f)=>x+f[k],0)/arr.length,lines=[],tips=[],cnt={};
  a.forEach(f=>f.df.forEach(d=>cnt[d]=(cnt[d]||0)+1));
  const top=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];
  lines.push(`לפי ${a.length} משובים: לחץ ממוצע ${avg(a,'st').toFixed(1)} מתוך 5, ניהול זמן ${avg(a,'tm').toFixed(1)} מתוך 5.`);
  if(top&&(a.length===1||cnt[top]>=2)){lines.push(`הקושי שחוזר הכי הרבה: ${top} (${cnt[top]} מתוך ${a.length}).`);tips.push(TIPS[top])}
  const hr=f=>f.time?+f.time.slice(0,2):null,late=a.filter(f=>hr(f)!==null&&hr(f)>=11),early=a.filter(f=>hr(f)!==null&&hr(f)<11);
  if(late.length>=2&&early.length>=2&&avg(late,'st')-avg(early,'st')>=0.8){lines.push('הלחץ שלך גבוה יותר במבחנים שנערכים בשעות המאוחרות של היום.');tips.push(TIPS['לחץ'])}
  else if(late.filter(f=>f.df.includes('ריכוז')).length>=2&&!early.some(f=>f.df.includes('ריכוז'))){lines.push('קשה לך יותר להתרכז במבחנים בשעות המאוחרות של היום.');tips.push(TIPS['ריכוז'])}
  const tp=a.filter(f=>f.sub&&(f.df.includes('לחץ זמן')||f.tm<=2));
  if(tp.length>=2&&tp.filter(f=>VERBAL.test(f.sub)).length/tp.length>=0.7){lines.push('לחץ הזמן מופיע בעיקר במבחנים עתירי מלל.');tips.push(TIPS['לחץ זמן'])}
  if(a.length>=4){const h=Math.floor(a.length/2),d=avg(a.slice(0,h),'st')-avg(a.slice(h),'st');if(d>=0.7)lines.push('הלחץ שלך במבחנים יורד בהדרגה. זה מצוין.')}
  if(avg(a,'st')>=3.5&&!tips.includes(TIPS['לחץ']))tips.push(TIPS['לחץ']);

}

function viewDay(now){

  if(now.getHours()*60+now.getMinutes()<h*60+m){evView=null;return {d:now,eve:false,late:false}}
  if(evView==='today')return {d:now,eve:false,late:true};
  let d=addD(now,1),k=0;
  while(!offMap[iso(d)]&&isQuiet(d)&&k<3){d=addD(d,1);k++} // Friday/Saturday without lessons: jump to the next school day
  return {d,eve:true,late:true};
}
function eveUI(v,now){
  const box=$('eve'),h=$('sched').querySelector('h2'),tom=iso(addD(now,1));
  box.hidden=!v.late;
  if(!v.late){h.textContent='המערכת של היום';return}
  if(!v.eve){h.textContent='המערכת של היום';box.innerHTML='<span><b>מציג את הלו"ז להיום</b></span><button class="ghost" type="button" data-a="eve">הצג את מחר</button>';return}
  const name=iso(v.d)===tom?'מחר':'יום '+v.d.toLocaleDateString('he-IL',{weekday:'long'}).replace('יום ','');
  h.textContent='המערכת של '+name;
  let sum='';
  if(offInfo(v.d))sum='אין לימודים';
  else{
    const ls=dayLessons(v.d.getDay(),wkOk(v.d)).filter(l=>l.status!=='cancel'&&l.start);
    sum=ls.length?`${ls.length} שיעורים · מתחילים ב-${ls[0].start}`:'אין שיעורים';
  }
  box.innerHTML=`<span><b>${iso(v.d)===tom?'מציג את הלו"ז למחר':'מציג את הלו"ז ל'+name}</b><div class="meta">${dm(v.d)} · ${sum}</div></span><button class="ghost" type="button" data-a="today">הצג את היום</button>`;
}
$('eve').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;evView=b.dataset.a==='today'?'today':null;render()});

// ---- today's lessons with cancellations, changes and breaks ----
const toMin=x=>{const [h,m]=String(x).split(':').map(Number);return h*60+m};
function dayLessons(wd,useNotes=true){
  if(!week||!mine)return (sched[wd]||[]).map(l=>({start:l[0],end:'',subject:l[1],status:''}));
  const ms=new Set(mine),times={};
  week.lessons.forEach(l=>{times[l.n]=[l.start,l.end]});
  const out=week.lessons.filter(l=>l.day===wd&&ms.has(lk(l))).map(l=>({...l,status:'',note:''}));
  const toks=[...ms].flatMap(k=>k.split('|')).filter(x=>x.length>2);
  week.notes.filter(n=>useNotes&&n.day===wd&&toks.some(k=>n.text.includes(k))).forEach(n=>{
    const t=n.text,tm=times[n.n]||['',''],slot=out.filter(l=>l.n===n.n),m=t.match(/^ביטול\s+(.+?)(?:,\s*(.+))?$/);
    if(m){
      const hit=slot.find(l=>t.includes(l.subject)||(l.teacher&&t.includes(l.teacher)));
      if(hit){hit.status='cancel'}
      else out.push({n:n.n,start:tm[0],end:tm[1],subject:m[1],teacher:m[2]||'',status:'cancel'});
      return;
    }
    const note=t.replace('<-','←'),nk=noteKind(t),st=nk==='change'?'change':nk==='activity'?'special':'exam',tag=KTAG[nk]||'';
    if(slot.length)slot.forEach(l=>{l.status=st;l.note=note;l.nk=nk;l.tag=tag});
    else out.push({n:n.n,start:tm[0],end:tm[1],subject:st==='change'?'שינוי':tag,status:st,note,nk,tag});
  });
  return out.filter(l=>l.start).sort((a,b)=>toMin(a.start)-toMin(b.start));
}
function lessonsHTML(now){
  if(offInfo(now))return vacHTML(now);
  const e0=evsToday(now),timed=e0.filter(e=>e.time&&TIMEK.includes(kindOf(e))),sp=e0.filter(e=>kindOf(e)==='day'||(!e.time&&TIMEK.includes(kindOf(e)))).map(evCardHTML).join('')+specialHTML(now);
  const ls=dayLessons(now.getDay(),wkOk(now));
  if(!ls.length&&!timed.length)return sp+`<div class="empty">${Object.keys(sched).length||week?'אין שיעורים היום. זמן טוב להתקדם במשימות.':'עדיין אין מערכת. אפשר להגדיר אותה למטה, ב״מערכת ואירועים״.'}</div>`;
  const items=ls.map(l=>({t:toMin(l.start),k:1,l}));
  timed.forEach(e=>items.push({t:toMin(e.time),k:1,ev:e}));
  const act=ls.filter(l=>l.status!=='cancel'&&l.end);
  for(let i=1;i<act.length;i++){
    const gap=toMin(act[i].start)-toMin(act[i-1].end);
    if(gap>=20)items.push({t:toMin(act[i-1].end),k:0,gap:{a:act[i-1].end,b:act[i].start,d:gap}});
  }
  return sp+items.sort((x,y)=>x.t-y.t||x.k-y.k).map(it=>{
    if(it.gap)return `<div class="brk">${it.gap.d<=30?'הפסקה':'חלון'} ${it.gap.a}–${it.gap.b} · ${it.gap.d} דק׳</div>`;
    if(it.ev){const e=it.ev,k=kindOf(e);return `<div class="lesson k-${k}"><time>${esc(e.time)}</time><span>${esc(e.title)}</span><em class="ktag t-${k}">${KTAG[k]}</em></div>`}
    const l=it.l,c=l.status==='cancel';
    return `<div class="lesson${c?' off':''}${l.status==='special'?' k-activity':l.status==='exam'?' k-'+l.nk:''}" data-sub="${esc(l.subject)}" data-t="${esc(l.teacher||'')}" role="button" tabindex="0"><time>${l.start}${l.end?`<small>${l.end}</small>`:''}</time><span>${c?`<s>${esc(l.subject)}</s>`:esc(l.subject)}${l.status==='change'?` <span class="arr">←</span> ${esc(l.note)}`:(l.status==='special'||l.status==='exam')?` <span class="arr">·</span> ${esc(l.note)}`:''}</span>${c?'<em class="tag">בוטל</em>':l.status==='special'?'<em class="ktag t-activity">פעילות</em>':l.status==='exam'?`<em class="ktag t-${l.nk}">${esc(l.tag)}</em>`:''}</div>`;
  }).join('');
}

// ---- Calendar: day / 3 days / week / month ----
let calV=store.get('so_calv','3d'),calD=new Date();calD.setHours(0,0,0,0);
const calT={day:'יום','3d':'3 ימים',week:'שבוע',month:'חודש'};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function itemsFor(d){
  const wd=d.getDay(),key=iso(d),off=offInfo(d);
  const cur=!!(week&&week.days&&week.days[wd]&&week.days[wd].date===pad(d.getDate())+'.'+pad(d.getMonth()+1));
  const les=off?[]:dayLessons(wd,cur).map(l=>({...l,s:toMin(l.start),e:l.end?toMin(l.end):toMin(l.start)+45}));
  const ev=evs.filter(e=>e.date===key&&!(off&&isOff(e)));
  const due=tasks.filter(t=>!t.done&&!t.del&&t.due.slice(0,10)===key).map(t=>({...t,s:toMin(t.due.slice(11,16)),u:urgency(t)}));
  return {les,ev,due,off};
}
function offBar(data,i){
  const x=data[i];if(!x.off)return '';
  const same=j=>data[j]&&data[j].off&&data[j].off.a.getTime()===x.off.a.getTime(),p=same(i-1),n=same(i+1);
  return `<span class="evc offbar" style="margin-inline-start:${p?-2:0}px;margin-inline-end:${n?-2:0}px;border-start-start-radius:${p?0:6}px;border-end-start-radius:${p?0:6}px;border-start-end-radius:${n?0:6}px;border-end-end-radius:${n?0:6}px">${p?'&nbsp;':esc(x.off.title||'')}</span>`;
}
function gridHTML(days){
  const data=days.map(itemsFor);
  let lo=420,hi=960;
  data.forEach(x=>{x.les.forEach(l=>{lo=Math.min(lo,l.s);hi=Math.max(hi,l.e)});x.due.forEach(t=>{lo=Math.min(lo,t.s);hi=Math.max(hi,t.s+30)})});
  lo=Math.floor(Math.max(lo,360)/60)*60;hi=Math.ceil(Math.min(hi,1380)/60)*60;
  const H=52,px=m=>(m-lo)/60*H,tot=px(hi),now=new Date(),nm=now.getHours()*60+now.getMinutes(),hrs=(hi-lo)/60;
  const gut=`<div class="gut" style="height:${tot}px">${Array.from({length:hrs+1},(_,i)=>`<span style="top:${i*H}px">${pad(lo/60+i)}:00</span>`).join('')}</div>`;
  const heads=days.map(d=>`<button class="ch${iso(d)===iso(now)?' td':''}" data-d="${iso(d)}"><small>${d.toLocaleDateString('he-IL',{weekday:'short'}).replace('יום ','')}</small><b>${d.getDate()}</b></button>`).join('');
  const anyEv=data.some(x=>x.ev.length||x.off);
  const allday=anyEv?`<div class="ghd"><span></span>${data.map((x,i)=>`<div class="ad">${offBar(data,i)}${x.ev.map(e=>`<span class="evc k-${kindOf(e)}">${e.time?esc(e.time)+' ':''}${esc(e.title)}</span>`).join('')}</div>`).join('')}</div>`:'';
  const cols=days.map((d,i)=>{
    const x=data[i];
    const lines=Array.from({length:hrs},(_,k)=>`<i style="top:${k*H}px"></i>`).join('');
    const b=x.les.map(l=>`<div class="blk${l.status==='cancel'?' off':''}${l.status==='change'?' chg':''}${l.status==='special'?' sp':''}${l.status==='exam'?' ex':''}" style="top:${px(l.s)}px;height:${Math.max(18,px(l.e)-px(l.s)-2)}px"><b>${l.status==='cancel'?`<s>${esc(l.subject)}</s>`:esc(l.subject)}</b>${l.status==='change'?`<span>← ${esc(l.note)}</span>`:(l.status==='special'||l.status==='exam')?`<span>${esc(l.note)}</span>`:l.status==='cancel'?'<span>בוטל</span>':l.room?`<span>${esc(l.room)}</span>`:''}</div>`).join('');
    const dd=x.due.map(t=>`<div class="dd" style="top:${px(t.s)}px;background:${level(t.u)}">${esc(t.name)}</div>`).join('');
    const nl=iso(d)===iso(now)&&nm>=lo&&nm<=hi?`<div class="nl" style="top:${px(nm)}px"></div>`:'';
    return `<div class="col${x.off?' offc':''}" style="height:${tot}px">${lines}${b}${dd}${nl}</div>`;
  }).join('');
  return `<div class="cg" style="--n:${days.length}"><div class="ghd"><span></span>${heads}</div>${allday}<div class="ghd gbd">${gut}${cols}</div></div>`;
}
function monthHTML(d){
  const first=new Date(d.getFullYear(),d.getMonth(),1),start=addD(first,-first.getDay());
  const cells=Array.from({length:42},(_,i)=>addD(start,i));
  const n=cells.slice(35).every(c=>c.getMonth()!==d.getMonth())?35:42,today=iso(new Date());
  return `<div class="mh">${['א','ב','ג','ד','ה','ו','ש'].map(x=>`<span>${x}</span>`).join('')}</div><div class="mg">`+cells.slice(0,n).map((c,i)=>{
    const it=itemsFor(c),cancel=it.les.some(l=>l.status==='cancel'),o=it.off;
    const same=j=>{const cj=cells[j];if(!o||!cj||Math.floor(j/7)!==Math.floor(i/7))return false;const oj=offInfo(cj);return !!oj&&oj.a.getTime()===o.a.getTime()},p=same(i-1),nx=same(i+1);
    const st=o?` style="margin-inline-start:${p?-2:0}px;margin-inline-end:${nx?-2:0}px;border-start-start-radius:${p?0:12}px;border-end-start-radius:${p?0:12}px;border-start-end-radius:${nx?0:12}px;border-end-end-radius:${nx?0:12}px"`:'';
    const dots=[...it.due.slice(0,3).map(t=>`<i style="background:${level(t.u)}"></i>`),...it.ev.slice(0,2).map(e=>`<i style="background:${KCOL[kindOf(e)]||'var(--ac)'}"></i>`),...(cancel?['<i style="background:var(--r)"></i>']:[])].join('');
    return `<button class="mc${c.getMonth()!==d.getMonth()?' dim':''}${iso(c)===today?' td':''}${o?' moff':''}" data-d="${iso(c)}"${st}><b>${c.getDate()}</b><span class="dots">${dots}</span></button>`;
  }).join('')+`</div><div class="meta" style="margin-top:10px">הגשות בצבע הדחיפות · אירועים בירוק מעושן · מבחנים בשחור · פעילויות בסגול · ביטולים באדום · חופשה ברצף מסומנת בפס</div>`;
}
function renderCal(){
  if(!document.body.classList.contains('calmode'))return;
  const v=calV,d=new Date(calD);let days=[],title='';
  $('cseg').innerHTML=Object.keys(calT).map(k=>`<button class="chip" data-v="${k}" aria-pressed="${k===v}">${calT[k]}</button>`).join('');
  if(v==='day'){days=[d];title=d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})}
  if(v==='3d')days=[0,1,2].map(i=>addD(d,i));
  if(v==='week'){const st=addD(d,-d.getDay());days=[0,1,2,3,4,5,6].map(i=>addD(st,i))}
  if(v==='3d'||v==='week'){const a=days[0],z=days[days.length-1];title=a.getMonth()===z.getMonth()?`${a.getDate()}–${z.getDate()} ${z.toLocaleDateString('he-IL',{month:'long'})}`:`${a.getDate()} ${a.toLocaleDateString('he-IL',{month:'short'})} – ${z.getDate()} ${z.toLocaleDateString('he-IL',{month:'short'})}`}
  if(v==='month')title=d.toLocaleDateString('he-IL',{month:'long',year:'numeric'});
  $('cti').textContent=title;
  $('cbody').innerHTML=v==='month'?monthHTML(d):gridHTML(days);
}
function navCal(dir){
  if(calV==='month')calD=new Date(calD.getFullYear(),calD.getMonth()+dir,1);
  else calD=addD(calD,dir*({day:1,'3d':3,week:7}[calV]));
  renderCal();
}
$('cseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;calV=b.dataset.v;store.set('so_calv',calV);renderCal()});
$('cbody').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;calV='day';calD=new Date(b.dataset.d+'T00:00');renderCal()});
$('cp').onclick=()=>navCal(-1);$('cnx').onclick=()=>navCal(1);
$('ctd').onclick=()=>{calD=new Date();calD.setHours(0,0,0,0);renderCal()};
$('calb').onclick=()=>{const on=document.body.classList.toggle('calmode');$('calb').textContent=on?'חזרה':'יומן';renderCal();scrollTo(0,0)};

// ---- edit tasks ----
let editId=null;
function openEdit(t){
  editId=t.id;
  $('fh').textContent='עריכת משימה';$('fs').textContent='שמור שינויים';
  $('n').value=t.name;$('s').value=t.sub;$('e').value=t.est;$('sug').textContent='';
  $('d').value=t.due.slice(0,10);$('tm').value=t.due.slice(11,16);
  touched=true;dhmsg='';$('mp').hidden=true;buildStrip();
  $('addsec').classList.add('open');
}
function cancelEdit(){
  editId=null;$('fh').textContent='משימה חדשה';$('fs').textContent='הוסף משימה';
  $('f').reset();$('e').value=30;$('sug').textContent='';setDef();
}
function closeSheet(){$('addsec').classList.remove('open');if(editId)cancelEdit()}

// ---- events: add / edit / delete ----
let evEdit=null;
const evDate=d=>d.split('-').reverse().join('.');
function evsHTML(){
  return evs.map((e,i)=>evEdit===i
    ?`<div class="ev edit"><input data-f="t" value="${esc(e.title)}" aria-label="שם האירוע"><input data-f="d" type="date" value="${e.date}" aria-label="תאריך"><select data-f="k" aria-label="סוג">${kindOpts(kindOf(e))}</select><input data-f="tm" type="time" value="${e.time||''}" aria-label="שעה"><button class="btn" type="button" data-a="save" data-i="${i}">שמור</button><button class="btn alt" type="button" data-a="cancel">ביטול</button></div>`
    :`<div class="ev"><span>${esc(e.title)} <span class="meta">${evDate(e.date)}${kindOf(e)!=='info'?' · '+KINDS[kindOf(e)]:''}${e.time?' · '+e.time:''}</span></span><span><button class="x" data-a="edit" data-i="${i}" aria-label="ערוך">ערוך</button><button class="x" data-a="del" data-i="${i}" aria-label="מחק">×</button></span></div>`
  ).join('');
}
function saveEv(){evs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);store.set('so_ev',evs);evEdit=null;render();pushSync()}
$('evl').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const i=+b.dataset.i,a=b.dataset.a;
  if(a==='edit'){evEdit=i;renderEv()}
  else if(a==='cancel'){evEdit=null;renderEv()}
  else if(a==='save'){
    const row=b.closest('.ev'),t=row.querySelector('[data-f="t"]').value.trim(),d=row.querySelector('[data-f="d"]').value;
    if(!t||!d)return;
    const tm=row.querySelector('[data-f="tm"]').value;evs[i]={title:t,date:d,kind:row.querySelector('[data-f="k"]').value,...(tm?{time:tm}:{})};saveEv();
  }else if(a==='del'){
    const [ev]=evs.splice(i,1);saveEv();
    toast('האירוע נמחק',()=>{evs.push(ev);saveEv()});
  }
});
$('evk').innerHTML=kindOpts('info');
$('evn').addEventListener('input',()=>{$('evk').value=classifyKind($('evn').value)});
$('eva').onclick=()=>{
  const t=$('evn').value.trim(),d=$('evd').value;
  if(!t||!d){$('pm').textContent='כתבו שם ובחרו תאריך.';return}
  evs.push({title:t,date:d,kind:$('evk').value,...($('evt').value?{time:$('evt').value}:{})});saveEv();$('evn').value='';$('evd').value='';$('evk').value='info';$('evt').value='';$('pm').textContent='האירוע נוסף';
};
render();setInterval(render,60000);
