<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudentOS</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fffdf9;--ink:#2b2f2c;--mute:#7d837e;--line:#e6e2d8;--g:#8fbf9f;--y:#e8c872;--r:#e29a8c;--ac:#6f9c86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c201e;--card:#252a27;--ink:#e9ece8;--mute:#98a09a;--line:#343b37;--g:#6fa282;--y:#c9a957;--r:#c77d6f;--ac:#8fbfa5}}
:root[data-theme="dark"]{--bg:#1c201e;--card:#252a27;--ink:#e9ece8;--mute:#98a09a;--line:#343b37;--g:#6fa282;--y:#c9a957;--r:#c77d6f;--ac:#8fbfa5}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Heebo,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 20px 80px}
h1,h2{font-family:"Frank Ruhl Libre",serif;margin:0}
h1{font-size:34px;line-height:1.2}
h2{font-size:21px;margin:40px 0 12px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{color:var(--mute);margin-top:4px}
button,input,select{font:inherit;color:inherit}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--mute)}
.ghost:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.lesson{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.lesson time{color:var(--mute);width:48px;flex:none;direction:ltr;text-align:right}
.task{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.bar{width:6px;border-radius:6px;flex:none}
.task b{font-weight:500;font-size:18px}
.meta{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink)}
form{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
label{font-size:14px;color:var(--mute);display:block}
.hint{font-size:13px;color:var(--ac)}
.empty{color:var(--mute);padding:12px 0}
.focus .task{padding:28px}
.setup{margin-top:48px}.setup summary{display:inline-block;list-style:none;cursor:pointer}
.setup .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;display:grid;gap:10px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;color:inherit;resize:vertical}
.ev{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--mute);cursor:pointer}
[hidden]{display:none!important}
.trk{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:4px 0 10px}.trk i{display:block;height:100%}
#pom{align-items:center;justify-content:space-between;margin-bottom:12px}.big{font:700 28px "Frank Ruhl Libre",serif;direction:ltr}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<main>
<header>
  <div><h1 id="hello">היום</h1><div class="date" id="date"></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
    <button class="ghost" id="clear">מצב ריכוז</button>
    <button class="ghost" id="theme">כהה/בהיר</button>
  </div>
</header>

<section id="sched">
  <h2>המערכת של היום</h2>
  <div id="lessons"></div>
</section>

<section id="evsec" hidden><h2>בקרוב</h2><div id="ev"></div></section>

<div id="pom" class="task" hidden></div>
<section id="tasksec">
  <h2 id="th">שלוש המשימות הבוערות</h2>
  <div id="tasks"></div>
</section>

<section id="addsec">
  <h2>משימה חדשה</h2>
  <form id="f">
    <div><label for="n">שם המשימה</label><input id="n" required></div>
    <div class="two">
      <div><label for="s">מקצוע</label><input id="s" list="subs" required><datalist id="subs"></datalist></div>
      <div><label for="e">זמן משוער (דקות)</label><input id="e" type="number" min="5" step="5" value="30" required></div>
    </div>
    <div class="hint" id="sug"></div>
    <div><label>מועד הגשה</label>
      <div class="chips" id="dc"></div>
      <div class="two" id="more" hidden style="margin-top:8px"><input id="d" type="date" required aria-label="תאריך"><input id="tm" type="time" required aria-label="שעה"></div>
    </div>
    <button class="btn" type="submit">הוסף משימה</button>
  </form>
</section>

<details class="setup"><summary class="ghost">מערכת ואירועים</summary>
  <div class="box">
    <div><label for="cls">כיתה</label><input id="cls" placeholder="יא - 1"></div>
    <button class="btn" type="button" id="sy">סנכרן מערכת מבית הספר</button>
    <div class="hint" id="sym"></div>
    <div id="pick"></div>
    <div><label for="dy">מערכת השעות ליום</label><select id="dy"></select></div>
    <textarea id="lt" rows="5" placeholder="שורה לכל שיעור:&#10;08:00 מתמטיקה&#10;09:45 אנגלית"></textarea>
    <button class="btn" type="button" id="ss">שמור יום</button>
    <div class="hint" id="sm"></div>
  </div>
  <div class="box">
    <div><label for="pdf">אירועי השנה (PDF)</label><input id="pdf" type="file" accept="application/pdf"></div>
    <textarea id="pt" rows="5" placeholder="או הדביקו כאן טקסט, שורה לכל אירוע:&#10;12.10 חופש סוכות&#10;3/11 מבחן במתמטיקה"></textarea>
    <button class="btn" type="button" id="pb">הוסף אירועים</button>
    <div class="hint" id="pm"></div>
    <div id="evl"></div>
  </div>
  <div class="box">
    <div><label for="nm">תזכורת בוקר</label><input id="nm" type="time"></div>
    <div><label for="nl">התראה לפני שיעור (דקות)</label><input id="nl" type="number" min="1" max="120"></div>
    <div><label for="nd">התראה לפני דדליין (שעות, בנוסף לזמן המשוער של המשימה)</label><input id="nd" type="number" min="1" max="168"></div>
    <button class="btn" type="button" id="nb">הפעל התראות</button>
    <button class="btn alt" type="button" id="nt">שלח התראת בדיקה</button>
    <div class="hint" id="ns"></div>
  </div>
</details>

<details class="setup" style="margin-top:16px"><summary class="ghost">סיכום שבועי</summary>
  <div class="box" id="wk"></div>
  <div class="box">
    <div class="two"><div><label for="gs">מקצוע</label><input id="gs" list="subs"></div><div><label for="gg">ציון</label><input id="gg" type="number" min="0" max="100"></div></div>
    <div><label for="gf">איך הרגיש?</label><select id="gf"><option>קל</option><option>בינוני</option><option>קשה</option></select></div>
    <button class="btn" type="button" id="gb">שמור ציון</button>
  </div>
</details>
</main>

<script>
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let tasks=store.get('so_tasks',[]);
let hist=store.get('so_hist',{}); // subject -> [actual minutes]
let clear=false;

let sched=store.get('so_sched',{});let evs=store.get('so_ev',[]);

function urgency(t){
  const hrs=Math.max((new Date(t.due)-Date.now())/36e5,0.25);
  return (t.est/60+12)/(hrs+1);
}
function level(u){return u>=0.6?'var(--r)':u>=0.25?'var(--y)':'var(--g)'}
function avg(sub){const a=hist[sub];if(!a||!a.length)return null;const r=a.slice(-5);return Math.round(r.reduce((x,y)=>x+y,0)/r.length)}
function fmt(d){return new Date(d).toLocaleString('he-IL',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}

function render(){
  const now=new Date();
  $('date').textContent=now.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  const ls=sched[now.getDay()]||[];
  const nt=todayNotes?todayNotes():[];
  $('lessons').innerHTML=(typeof nt!=='undefined'&&nt.length?nt.map(x=>`<div class="meta" style="color:var(--r)">${esc(x)}</div>`).join(''):'')+(ls.length?ls.map(l=>`<div class="lesson"><time>${l[0]}</time><span>${l[1]}</span></div>`).join(''):`<div class="empty">${Object.keys(sched).length?'אין שיעורים היום. זמן טוב להתקדם במשימות.':'עדיין אין מערכת. אפשר להגדיר אותה למטה, ב״מערכת ואירועים״.'}</div>`);
  const open=tasks.filter(t=>!t.done).map(t=>({...t,u:urgency(t)})).sort((a,b)=>b.u-a.u);
  const shown=clear?open.slice(0,1):open.slice(0,3);
  $('th').textContent=clear?'המשימה הבוערת ביותר':'שלוש המשימות הבוערות';
  document.body.classList.toggle('focus',clear);
  $('sched').hidden=clear;renderEv();streakUI();renderWeek();$('addsec').hidden=clear;
  $('tasks').innerHTML=shown.length?shown.map(t=>`
    <div class="task"><div class="bar" style="background:${level(t.u)}"></div>
      <div style="flex:1"><b>${esc(t.name)}</b>
        <div class="meta">${esc(t.sub)} · עד ${fmt(t.due)} · כ-${t.est} דק׳</div>
        <div class="row" data-id="${t.id}">
          <button class="btn" data-a="done">סיימתי</button>
          <button class="btn alt" data-a="focus">פוקוס 25 דק׳</button>
          <button class="btn alt" data-a="del">מחק</button>
        </div></div></div>`).join(''):'<div class="empty">אין משימות פתוחות. הוסיפו משימה כדי להתחיל.</div>';
  if(!clear&&open.length>3)$('tasks').insertAdjacentHTML('beforeend',`<div class="meta">ועוד ${open.length-3} משימות פתוחות בהמשך.</div>`);
  $('subs').innerHTML=[...new Set([...tasks.map(t=>t.sub),...Object.keys(hist)])].map(s=>`<option value="${esc(s)}">`).join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function save(){store.set('so_tasks',tasks);store.set('so_hist',hist)}

$('f').addEventListener('submit',e=>{
  e.preventDefault();
  tasks.push({id:Date.now(),name:$('n').value.trim(),sub:$('s').value.trim(),est:+$('e').value,due:$('d').value+'T'+$('tm').value,done:false});
  save();$('f').reset();$('e').value=30;$('sug').textContent='';setDef();render();
});
$('s').addEventListener('input',()=>{
  const a=avg($('s').value.trim());
  if(a){$('e').value=a;$('sug').textContent=`הערכה מותאמת: ${a} דקות, לפי המשימות האחרונות שלך ב${$('s').value.trim()}`}
  else $('sug').textContent='';
});
$('tasks').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=+b.parentElement.dataset.id,t=tasks.find(x=>x.id===id);
  if(b.dataset.a==='focus'){pom={end:Date.now()+25*6e4,mode:'work',name:t.name};return pomUI()}
  if(b.dataset.a==='del'){tasks=tasks.filter(x=>x.id!==id)}
  else{
    const v=prompt(`כמה דקות זה לקח בפועל? (הערכה: ${t.est})`,t.est);
    if(v===null)return;
    const m=parseInt(v,10);
    if(m>0){(hist[t.sub]=hist[t.sub]||[]).push(m)}
    t.done=true;t.act=m>0?m:t.est;t.doneAt=Date.now();
  }
  save();render();
});
$('clear').onclick=()=>{clear=!clear;$('clear').textContent=clear?'חזרה לתצוגה מלאה':'מצב ריכוז';render()};
$('theme').onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark';store.set('so_theme',r.dataset.theme);
};
const th=store.get('so_theme',null);if(th)document.documentElement.dataset.theme=th;

// Date entry: three quick chips, rest tucked under "other"
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function inDays(n){const d=new Date();d.setDate(d.getDate()+n);return d}
const dayChips=[['היום',0],['מחר',1],['מחרתיים',2],['אחר…',null]];
let other=false;
function mark(){
  [...$('dc').children].forEach((b,i)=>{const n=dayChips[i][1];b.setAttribute('aria-pressed',n===null?other:(!other&&iso(inDays(n))===$('d').value))});
  $('more').hidden=!other;
}
dayChips.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=c[0];
  b.onclick=()=>{if(c[1]===null){other=true}else{other=false;$('d').value=iso(inDays(c[1]));$('tm').value='08:00'}mark()};
  $('dc').appendChild(b)});
function setDef(){other=false;$('d').value=iso(inDays(1));$('tm').value='08:00';$('d').min=iso(new Date());mark()}
setDef();

// ---- Stage 2: schedule + events ----
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי'];
$('dy').innerHTML=DAYS.map((n,i)=>`<option value="${i}">יום ${n}</option>`).join('');
$('cls').value=store.get('so_cls','יא - 1');
$('cls').addEventListener('input',()=>store.set('so_cls',$('cls').value));
function loadDay(){$('lt').value=(sched[$('dy').value]||[]).map(l=>l[0]+' '+l[1]).join('\n')}
$('dy').addEventListener('change',()=>{$('sm').textContent='';loadDay()});
$('ss').onclick=()=>{
  const rows=$('lt').value.split('\n').map(l=>l.trim().match(/^(\d{1,2}):(\d{2})\s+(.+)$/)).filter(Boolean).map(m=>[pad(+m[1])+':'+m[2],m[3]]).sort((a,b)=>a[0]<b[0]?-1:1);
  sched[$('dy').value]=rows;store.set('so_sched',sched);loadDay();render();
  $('sm').textContent=`נשמרו ${rows.length} שיעורים ליום ${DAYS[$('dy').value]}`;
};
loadDay();
function today0(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseEvents(txt){
  const n=new Date(),y0=n.getMonth()>=8?n.getFullYear():n.getFullYear()-1;let out=[];
  txt.split('\n').forEach(l=>{
    const m=l.match(/(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?/);if(!m)return;
    const dd=+m[1],mm=+m[2];if(dd<1||dd>31||mm<1||mm>12)return;
    let yy=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):(mm>=9?y0:y0+1);
    const title=l.replace(m[0],'').replace(/\s+/g,' ').trim();if(!title)return;
    out.push({date:yy+'-'+pad(mm)+'-'+pad(dd),title});
  });
  return out;
}
$('pb').onclick=()=>{
  const f=parseEvents($('pt').value);
  const keys=new Set(evs.map(e=>e.date+e.title));let add=0;
  f.forEach(e=>{if(!keys.has(e.date+e.title)){evs.push(e);add++}});
  evs.sort((a,b)=>a.date<b.date?-1:1);store.set('so_ev',evs);
  $('pm').textContent=add?`נוספו ${add} אירועים`:'לא נמצאו אירועים חדשים. כל שורה צריכה תאריך (כמו 12.10) ושם.';
  if(add)$('pt').value='';render();
};
$('pdf').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  $('pm').textContent='קורא את הקובץ…';
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let out='';
    for(let i=1;i<=doc.numPages;i++){
      const c=await (await doc.getPage(i)).getTextContent(),rows={};
      c.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)});
      Object.keys(rows).sort((a,b)=>b-a).forEach(y=>{out+=rows[y].sort((a,b)=>b.transform[4]-a.transform[4]).map(i=>i.str).join(' ')+'\n'});
    }
    $('pt').value=out.trim();
    $('pm').textContent='הטקסט נקרא. אפשר לתקן אותו ואז ללחוץ ״הוסף אירועים״.';
  }catch(err){$('pm').textContent='לא הצלחתי לקרוא את הקובץ. אפשר להעתיק את הטקסט מה-PDF ולהדביק בתיבה.'}
});
function renderEv(){
  const t=today0(),lim=new Date(t);lim.setDate(lim.getDate()+30);
  const up=evs.filter(e=>{const d=new Date(e.date+'T00:00');return d>=t&&d<=lim}).slice(0,3);
  $('evsec').hidden=clear||!up.length;
  $('ev').innerHTML=up.map(e=>`<div class="ev"><span>${esc(e.title)}</span><span class="meta">${new Date(e.date+'T12:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'})}</span></div>`).join('');
  $('evl').innerHTML=evs.map((e,i)=>`<div class="ev"><span>${esc(e.title)} <span class="meta">${e.date.split('-').reverse().join('.')}</span></span><button class="x" data-i="${i}" aria-label="מחק">✕</button></div>`).join('');
}
$('evl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;evs.splice(+b.dataset.i,1);store.set('so_ev',evs);renderEv()});

// ---- Stage 3: in-page notifications ----
let cfg=Object.assign({on:false,morning:'07:30',lesson:10,dl:24},store.get('so_cfg',{}));
let fired=store.get('so_fired',{});
$('nm').value=cfg.morning;$('nl').value=cfg.lesson;$('nd').value=cfg.dl;
function saveCfg(){cfg.morning=$('nm').value||'07:30';cfg.lesson=+$('nl').value||10;cfg.dl=+$('nd').value||24;store.set('so_cfg',cfg)}
['nm','nl','nd'].forEach(i=>$(i).addEventListener('change',saveCfg));
function notify(t,b){try{new Notification(t,{body:b});return true}catch(e){return false}}
function nstat(){
  if(!('Notification' in window)){$('ns').textContent='הדפדפן הזה לא תומך בהתראות.';return}
  const p=Notification.permission;
  $('nb').textContent=cfg.on&&p==='granted'?'כבה התראות':'הפעל התראות';
  $('ns').textContent=p==='denied'?'ההתראות חסומות בהגדרות הדפדפן.':cfg.on&&p==='granted'?'התראות פעילות כל עוד האפליקציה פתוחה בדפדפן.':'';
}
$('nb').onclick=async()=>{
  if(!('Notification' in window))return nstat();
  if(cfg.on){cfg.on=false;store.set('so_cfg',cfg);return nstat()}
  try{const p=await Notification.requestPermission();cfg.on=p==='granted'}catch(e){cfg.on=false}
  saveCfg();nstat();
};
$('nt').onclick=()=>{$('ns').textContent=('Notification' in window)&&Notification.permission==='granted'&&notify('StudentOS','ההתראות עובדות')?'נשלחה התראה.':'לא הצלחתי לשלוח. קודם הפעל התראות ואשר בדפדפן.'};
function fire(k,t,b){if(fired[k])return;fired[k]=1;store.set('so_fired',fired);notify(t,b)}
function tick(){
  if(!cfg.on||!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date(),day=iso(now);
  // morning summary (only within 3 hours of the set time)
  const [mh,mm]=cfg.morning.split(':').map(Number),mt=new Date(now);mt.setHours(mh,mm,0,0);
  if(now>=mt&&now-mt<3*36e5){
    const ls=sched[now.getDay()]||[],top=tasks.filter(t=>!t.done).map(t=>({...t,u:urgency(t)})).sort((a,b)=>b.u-a.u).slice(0,3);
    const evT=evs.filter(e=>e.date===day).map(e=>e.title);
    fire('m'+day,'בוקר טוב',[ls.length?`${ls.length} שיעורים היום`:'אין שיעורים היום',...evT,top.length?'בוער: '+top.map(t=>t.name).join(', '):''].filter(Boolean).join(' · '));
  }
  (sched[now.getDay()]||[]).forEach(l=>{
    const [h,m]=l[0].split(':').map(Number),t=new Date(now);t.setHours(h,m,0,0);
    const diff=(t-now)/6e4;
    if(diff>0&&diff<=cfg.lesson)fire('l'+day+l[0],l[1],`מתחיל בעוד ${Math.ceil(diff)} דקות`);
  });
  tasks.filter(t=>!t.done).forEach(t=>{
    const hrs=(new Date(t.due)-now)/36e5;
    if(hrs>0&&hrs<=cfg.dl+t.est/60)fire('d'+t.id,t.name,`ההגשה בעוד ${hrs<1?Math.round(hrs*60)+' דקות':Math.round(hrs)+' שעות'}. צפוי לקחת ${avg(t.sub)||t.est} דקות`);
  });
}
nstat();setInterval(tick,30000);tick();

// ---- Stage 4: streak, weekly report, grades, focus timer ----
let days=store.get('so_days',{}),grades=store.get('so_gr',[]),pom=null;
function streakUI(){
  const now=new Date(),end=new Date(now);end.setHours(23,59,59,999);
  const openDue=tasks.some(t=>!t.done&&new Date(t.due)<=end);
  const doneToday=tasks.some(t=>t.done&&t.doneAt&&iso(new Date(t.doneAt))===iso(now));
  if(!openDue&&doneToday&&!days[iso(now)]){days[iso(now)]=1;store.set('so_days',days)}
  let n=0,d=new Date(now);if(!days[iso(d)])d.setDate(d.getDate()-1);
  while(days[iso(d)]){n++;d.setDate(d.getDate()-1)}
  if(n)$('date').textContent+=` · רצף של ${n} ימים`;
}
function renderWeek(){
  const since=Date.now()-7*864e5,done=tasks.filter(t=>t.done&&t.doneAt>=since&&t.act);
  const by={};done.forEach(t=>{const o=by[t.sub]=by[t.sub]||{a:0,e:0};o.a+=t.act;o.e+=t.est});
  const subs=Object.keys(by).map(k=>({k,a:by[k].a,e:by[k].e,r:by[k].a/by[k].e})).sort((x,y)=>y.r-x.r);
  const gw=grades.filter(g=>g.t>=since),recs=[];
  if(!done.length){$('wk').innerHTML='<div class="empty">עדיין אין נתונים לשבוע הזה. סיימו כמה משימות והסיכום יתמלא.</div>';}
  else{
    const hard=subs[0].r>1.15?`<div><b>במה התקשיתי:</b> ${esc(subs[0].k)}, לקח פי ${subs[0].r.toFixed(1)} מהמתוכנן</div>`:'<div><b>במה התקשיתי:</b> בשבוע הזה עמדת בהערכות הזמן.</div>';
    subs.filter(x=>x.r>1.25).forEach(x=>recs.push(`כדאי להקצות ל${esc(x.k)} יותר זמן, בפועל זה לוקח פי ${x.r.toFixed(1)}.`));
    const m30=Date.now()-30*864e5,hardCnt={};
    grades.filter(g=>g.t>=m30&&g.f==='קשה').forEach(g=>hardCnt[g.s]=(hardCnt[g.s]||0)+1);
    Object.keys(hardCnt).filter(k=>hardCnt[k]>=2).forEach(k=>recs.push(`מומלץ להתחיל להתכונן ל${esc(k)} 3 ימים מראש.`));
    $('wk').innerHTML=`<div><b>${done.length}</b> משימות הושלמו, ${Math.round(done.reduce((x,t)=>x+t.act,0)/6)/10} שעות עבודה</div>`+hard+
      subs.map(x=>`<div><div class="meta">${esc(x.k)}: ${x.a} דק׳ בפועל, ${x.e} מתוכננות</div><div class="trk"><i style="width:${Math.min(100,x.r*50)}%;background:${x.r>1.25?'var(--r)':'var(--g)'}"></i></div></div>`).join('')+
      (gw.length?`<div><b>ציונים:</b> ${gw.map(g=>`${esc(g.s)} ${g.g} (${g.f})`).join(', ')}</div>`:'')+
      `<div><b>לשבוע הבא:</b> ${recs.length?recs.join(' '):'ממשיכים באותו קצב.'}</div>`;
  }
}
$('gb').onclick=()=>{
  const s=$('gs').value.trim(),g=+$('gg').value;if(!s||!$('gg').value)return;
  grades.push({s,g,f:$('gf').value,t:Date.now()});store.set('so_gr',grades);$('gg').value='';renderWeek();
};
function pomUI(){
  const el=$('pom');
  if(!pom){el.hidden=true;return}
  let left=Math.round((pom.end-Date.now())/1000);
  if(left<=0){
    const w=pom.mode==='work';
    if(cfg.on&&Notification.permission==='granted')notify('StudentOS',w?'סבב סיים. הפסקה של 5 דקות':'ההפסקה נגמרה');
    pom=w?{end:Date.now()+5*6e4,mode:'break',name:pom.name}:null;
    if(!pom){el.hidden=true;return}left=300;
  }
  el.hidden=false;
  el.innerHTML=`<div><div class="meta">${pom.mode==='work'?'מתמקדים ב':'הפסקה אחרי'}: ${esc(pom.name)}</div><div class="big">${pad(Math.floor(left/60))}:${pad(left%60)}</div></div><button class="btn alt" id="ps">עצור</button>`;
  $('ps').onclick=()=>{pom=null;pomUI()};
}
setInterval(pomUI,1000);

// ---- School sync (needs /api/timetable, available after deploying to Vercel) ----
let week=store.get('so_week',null),mine=store.get('so_mine',null);
const lk=l=>l.subject+'|'+l.teacher;
function rebuildSched(){
  if(!week||!mine)return;
  const ms=new Set(mine),out={};
  week.lessons.filter(l=>ms.has(lk(l))).forEach(l=>{(out[l.day]=out[l.day]||[]).push([l.start,l.subject])});
  Object.keys(out).forEach(d=>{const seen={};out[d]=out[d].sort((a,b)=>a[0]<b[0]?-1:1).filter(x=>!seen[x[0]]&&(seen[x[0]]=1))});
  sched=out;store.set('so_sched',sched);render();
}
function renderPick(){
  if(!week){$('pick').innerHTML='';return}
  const slots={};week.lessons.forEach(l=>{const k=l.day+'-'+l.n;slots[k]=(slots[k]||0)+1});
  const uniq={};week.lessons.forEach(l=>{const k=lk(l),o=uniq[k]=uniq[k]||{l,alone:true};if(slots[l.day+'-'+l.n]>1)o.alone=false});
  if(!mine)mine=Object.keys(uniq).filter(k=>uniq[k].alone);
  $('pick').innerHTML='<label>סמן את השיעורים שלך (בשעות עם כמה אפשרויות)</label>'+Object.keys(uniq).filter(k=>!uniq[k].alone).sort().map(k=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto" data-k="${esc(k)}" ${mine.includes(k)?'checked':''}>${esc(uniq[k].l.subject)} <span class="meta">${esc(uniq[k].l.teacher)}</span></label>`).join('');
}
$('pick').addEventListener('change',e=>{
  const k=e.target.dataset.k;if(!k)return;
  mine=e.target.checked?[...new Set([...mine,k])]:mine.filter(x=>x!==k);
  store.set('so_mine',mine);rebuildSched();
});
$('sy').onclick=async()=>{
  const c=$('cls').value.trim();if(!c){$('sym').textContent='קודם כתבו את הכיתה, למשל: יא - 1';return}
  $('sym').textContent='מושך את המערכת…';
  try{
    const r=await fetch('/api/timetable?class='+encodeURIComponent(c));
    if(!r.ok)throw new Error(r.status);
    week=await r.json();if(!week.lessons||!week.lessons.length)throw new Error('empty');
    store.set('so_week',week);mine=null;renderPick();
    store.set('so_mine',mine);rebuildSched();
    $('sym').textContent=`נקלטו ${week.lessons.length} שיעורים. סמנו למטה את הקבוצות שלכם.`;
  }catch(err){
    $('sym').textContent='הסנכרון עובד רק אחרי העלאה ל-Vercel, או שהכיתה לא נמצאה. אפשר להמשיך בהזנה ידנית.';
  }
};
renderPick();
function todayNotes(){
  if(!week)return [];
  const d=new Date().getDay(),ms=new Set(mine||[]);
  const keys=[...ms].flatMap(k=>k.split('|')).filter(x=>x.length>2);
  return week.notes.filter(n=>n.day===d&&keys.some(k=>n.text.includes(k)||k.includes(n.text))).map(n=>n.text);
}
render();setInterval(render,60000);
</script>
