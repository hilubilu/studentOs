<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#6f9c86">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudentOS</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fffdf9;--ink:#2b2f2c;--mute:#7d837e;--line:#e6e2d8;--g:#8fbf9f;--y:#e8c872;--r:#e29a8c;--ac:#6f9c86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c201e;--card:#252a27;--ink:#e9ece8;--mute:#98a09a;--line:#343b37;--g:#6fa282;--y:#c9a957;--r:#c77d6f;--ac:#8fbfa5}}
:root[data-theme="dark"]{--bg:#1c201e;--card:#252a27;--ink:#e9ece8;--mute:#98a09a;--line:#343b37;--g:#6fa282;--y:#c9a957;--r:#c77d6f;--ac:#8fbfa5}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Heebo,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 20px 80px}
h1,h2{font-family:"Frank Ruhl Libre",serif;margin:0}
h1{font-size:34px;line-height:1.2}
h2{font-size:21px;margin:40px 0 12px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{color:var(--mute);margin-top:4px}
button,input,select{font:inherit;color:inherit}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--mute)}
.ghost:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.lesson{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.lesson time{color:var(--mute);width:48px;flex:none;direction:ltr;text-align:right}
.task{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.bar{width:6px;border-radius:6px;flex:none}
.task b{font-weight:500;font-size:18px}
.meta{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink)}
form{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
label{font-size:14px;color:var(--mute);display:block}
.hint{font-size:13px;color:var(--ac)}
.empty{color:var(--mute);padding:12px 0}
.focus .task{padding:28px}
.setup{margin-top:48px}.setup summary{display:inline-block;list-style:none;cursor:pointer}
.setup .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;display:grid;gap:10px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;color:inherit;resize:vertical}
.ev{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--mute);cursor:pointer}
[hidden]{display:none!important}
.trk{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:4px 0 10px}.trk i{display:block;height:100%}
#pom{align-items:center;justify-content:space-between;margin-bottom:12px}.big{font:700 28px "Frank Ruhl Libre",serif;direction:ltr}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}

body{background:radial-gradient(1000px 420px at 50% -180px,color-mix(in srgb,var(--ac) 24%,transparent),transparent),var(--bg)}
h1{font-family:Heebo,sans-serif;font-weight:700;font-size:30px;letter-spacing:-.02em}
h2{font-family:Heebo,sans-serif;font-weight:500;font-size:14px;color:var(--mute);margin:30px 0 10px;letter-spacing:.02em}
.task{border:0;border-radius:20px;box-shadow:0 1px 2px #0000000d,0 10px 26px -14px #00000040}
#tasks .task:first-child{padding:22px}#tasks .task:first-child b{font-size:21px}
.lesson{background:var(--card);border:0;border-radius:14px;padding:12px 16px;margin-bottom:8px;align-items:center}
.lesson time{font-weight:500;color:var(--ac)}
.btn,.ghost,.chip{border-radius:999px}
form,.setup .box{border:0;border-radius:20px;box-shadow:0 1px 2px #0000000d,0 10px 26px -14px #00000040}
#addsec{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;z-index:20;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -16px 48px #0004;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;transform:translateY(110%);transition:transform .25s ease}
#addsec.open{transform:none}
#addsec h2{margin-top:6px}
#addsec form{box-shadow:none;padding:0;background:none}
#fab{position:fixed;left:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:15;width:60px;height:60px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;line-height:1;box-shadow:0 10px 28px -6px #0006;cursor:pointer}
main{padding-bottom:120px}

.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dy{flex:none;width:54px;padding:8px 0;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:center;cursor:pointer;scroll-snap-align:start;line-height:1.25}
.dy small{display:block;color:var(--mute);font-size:12px}.dy b{font-size:18px;font-weight:500}
.dy[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}.dy[aria-pressed="true"] small{color:#ffffffcc}
.tp{display:flex;align-items:center;gap:6px}.tp select{flex:1;width:auto}
dialog{border:0;border-radius:24px;padding:22px;background:var(--bg);color:var(--ink);width:min(92vw,420px)}
dialog::backdrop{background:#0006;backdrop-filter:blur(3px)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<main>
<header>
  <div><h1 id="hello">היום</h1><div class="date" id="date"></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
    <button class="ghost" id="clear">מצב ריכוז</button>
    <button class="ghost" id="theme">כהה/בהיר</button>
  </div>
</header>

<div id="pbn" class="task" hidden></div>
<section id="sched">
  <h2>המערכת של היום</h2>
  <div id="lessons"></div>
</section>

<section id="evsec" hidden><h2>בקרוב</h2><div id="ev"></div></section>

<div id="pom" class="task" hidden></div>
<section id="tasksec">
  <h2 id="th">שלוש המשימות הבוערות</h2>
  <div id="tasks"></div>
</section>

<section id="addsec"><button class="x" id="cx" type="button" aria-label="סגור" style="float:left;font-size:22px">✕</button>
  <h2>משימה חדשה</h2>
  <form id="f">
    <div><label for="n">שם המשימה</label><input id="n" required></div>
    <div class="chips" id="sc"></div>
    <div class="two">
      <div><label for="s">מקצוע</label><input id="s" list="subs" required><datalist id="subs"></datalist></div>
      <div><label for="e">זמן משוער (דקות)</label><input id="e" type="number" min="5" step="5" value="30" required></div>
    </div>
    <div class="hint" id="sug"></div>
    <div><label>מועד הגשה</label>
      <div class="strip" id="dc"></div><div class="hint" id="dh"></div>
      <input id="d" type="hidden"><input id="tm" type="hidden">
      <div class="two" style="margin-top:6px"><div><label for="th">שעה</label><div class="tp"><select id="th"></select><b>:</b><select id="tmm"></select></div></div><div><label for="dx">תאריך אחר</label><input id="dx" type="date"></div></div>
    </div>
    <button class="btn" type="submit">הוסף משימה</button>
  </form>
</section>

<details class="setup" id="st"><summary class="ghost">מערכת ואירועים</summary>
  <div class="box">
    <div><label for="nmn">איך לקרוא לך?</label><input id="nmn" autocomplete="given-name" maxlength="20" placeholder="השם שלך"></div>
    <div><label for="cls">כיתה</label><input id="cls" placeholder="יא - 1" list="clsl" autocomplete="off"><datalist id="clsl"></datalist></div>
    <button class="btn" type="button" id="sy">סנכרן מערכת מבית הספר</button>
    <div class="hint" id="sym"></div>
    <div id="pick"></div>
    <div><label for="dy">מערכת השעות ליום</label><select id="dy"></select></div>
    <textarea id="lt" rows="5" placeholder="שורה לכל שיעור:&#10;08:00 מתמטיקה&#10;09:45 אנגלית"></textarea>
    <button class="btn" type="button" id="ss">שמור יום</button>
    <div class="hint" id="sm"></div>
  </div>
  <div class="box">
    <div><label for="pdf">אירועי השנה (PDF)</label><input id="pdf" type="file" accept="application/pdf"></div>
    <textarea id="pt" rows="5" placeholder="או הדביקו כאן טקסט, שורה לכל אירוע:&#10;12.10 חופש סוכות&#10;3/11 מבחן במתמטיקה"></textarea>
    <button class="btn" type="button" id="pb">הוסף אירועים</button>
    <div class="hint" id="pm"></div>
    <div id="evl"></div>
  </div>
  <div class="box">
    <div><label for="nm">תזכורת בוקר</label><input id="nm" type="time"></div>
    <div><label for="nl">התראה לפני שיעור (דקות)</label><input id="nl" type="number" min="1" max="120"></div>
    <div><label for="nd">התראה לפני דדליין (שעות, בנוסף לזמן המשוער של המשימה)</label><input id="nd" type="number" min="1" max="168"></div>
    <button class="btn" type="button" id="nb">הפעל התראות</button>
    <button class="btn alt" type="button" id="nt">שלח התראת בדיקה</button>
    <div class="hint" id="ns"></div>
  </div>
  <div class="box">
    <b>סנכרון בין מכשירים</b>
    <div id="sc_off" style="display:grid;gap:10px">
      <button class="btn" type="button" id="sc1">צור קוד סנכרון</button>
      <div><label for="sci">כבר יש לכם קוד ממכשיר אחר?</label><input id="sci" placeholder="xxxx-xxxx-xxxx-…" autocomplete="off" style="direction:ltr"></div>
      <button class="btn alt" type="button" id="sc2">חבר מכשיר זה</button>
    </div>
    <div id="sc_on" hidden>
      <div class="meta">הקוד שלכם. הוא המפתח לנתונים, אל תשתפו אותו.</div>
      <div id="scv" style="direction:ltr;font-family:monospace;word-break:break-all;margin:6px 0"></div>
      <div class="row"><button class="btn alt" type="button" id="scc">העתק</button><button class="btn alt" type="button" id="scx">נתק מכשיר זה</button></div>
    </div>
    <div class="hint" id="scm"></div>
  </div>
</details>

<details class="setup" style="margin-top:16px"><summary class="ghost">סיכום שבועי</summary>
  <div class="box" id="wk"></div>
  <div class="box">
    <div class="two"><div><label for="gs">מקצוע</label><input id="gs" list="subs"></div><div><label for="gg">ציון</label><input id="gg" type="number" min="0" max="100"></div></div>
    <div><label for="gf">איך הרגיש?</label><select id="gf"><option>קל</option><option>בינוני</option><option>קשה</option></select></div>
    <button class="btn" type="button" id="gb">שמור ציון</button>
  </div>
</details>
</main>
<dialog id="dlg"><h2 style="margin:0 0 4px;font-size:20px;color:var(--ink)">כמה זמן זה לקח?</h2><div class="meta" id="dlt"></div><div class="chips" id="dlc" style="margin:14px 0"></div><div class="row"><input id="dli" type="number" min="1" style="flex:1" aria-label="דקות"><button class="btn" id="dlok" type="button">סיום</button><button class="btn alt" id="dlno" type="button">ביטול</button></div></dialog>
<button id="fab" aria-label="משימה חדשה">+</button>

<script>
const $=id=>document.getElementById(id);
const SYNCK=['so_tasks','so_hist','so_gr','so_days','so_mine','so_picked','so_cls','so_name'];
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));if(SYNCK.includes(k)){localStorage.setItem('so_dirty','1');if(window.schedSync)schedSync()}}catch(e){}}
};
let tasks=store.get('so_tasks',[]);
let hist=store.get('so_hist',{}); // subject -> [actual minutes]
let clear=false;

let sched=store.get('so_sched',{});let evs=store.get('so_ev',[]);

function urgency(t){
  const hrs=Math.max((new Date(t.due)-Date.now())/36e5,0.25);
  return (t.est/60+12)/(hrs+1);
}
function level(u){return u>=0.6?'var(--r)':u>=0.25?'var(--y)':'var(--g)'}
function avg(sub){const a=hist[sub];if(!a||!a.length)return null;const r=a.slice(-5);return Math.round(r.reduce((x,y)=>x+y,0)/r.length)}
function fmt(d){return new Date(d).toLocaleString('he-IL',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}

function render(){
  const now=new Date();
  $('date').textContent=now.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  const ls=sched[now.getDay()]||[];
  const nt=todayNotes?todayNotes():[];
  $('lessons').innerHTML=(typeof nt!=='undefined'&&nt.length?nt.map(x=>`<div class="meta" style="color:var(--r)">${esc(x)}</div>`).join(''):'')+(ls.length?ls.map(l=>`<div class="lesson"><time>${l[0]}</time><span>${l[1]}</span></div>`).join(''):`<div class="empty">${Object.keys(sched).length?'אין שיעורים היום. זמן טוב להתקדם במשימות.':'עדיין אין מערכת. אפשר להגדיר אותה למטה, ב״מערכת ואירועים״.'}</div>`);
  const open=tasks.filter(t=>!t.done).map(t=>({...t,u:urgency(t)})).sort((a,b)=>b.u-a.u);
  const shown=clear?open.slice(0,1):open.slice(0,3);
  $('th').textContent=clear?'המשימה הבוערת ביותר':'שלוש המשימות הבוערות';
  document.body.classList.toggle('focus',clear);
  $('sched').hidden=clear;renderEv();streakUI();renderWeek();renderChips();$('addsec').hidden=clear;$('fab').hidden=clear;
  $('tasks').innerHTML=shown.length?shown.map(t=>`
    <div class="task"><div class="bar" style="background:${level(t.u)}"></div>
      <div style="flex:1"><b>${esc(t.name)}</b>
        <div class="meta">${esc(t.sub)} · עד ${fmt(t.due)} · כ-${avg(t.sub)||t.est} דק׳</div>
        <div class="row" data-id="${t.id}">
          <button class="btn" data-a="done">סיימתי</button>
          <button class="btn alt" data-a="focus">פוקוס 25 דק׳</button>
          <button class="btn alt" data-a="del">מחק</button>
        </div></div></div>`).join(''):'<div class="empty">אין משימות פתוחות. הוסיפו משימה כדי להתחיל.</div>';
  if(!clear&&open.length>3)$('tasks').insertAdjacentHTML('beforeend',`<div class="meta">ועוד ${open.length-3} משימות פתוחות בהמשך.</div>`);
  $('subs').innerHTML=[...new Set([...tasks.map(t=>t.sub),...Object.keys(hist)])].map(s=>`<option value="${esc(s)}">`).join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function save(){store.set('so_tasks',tasks);store.set('so_hist',hist);pushSync()}

$('f').addEventListener('submit',e=>{
  e.preventDefault();
  tasks.push({id:Date.now(),name:$('n').value.trim(),sub:$('s').value.trim(),est:+$('e').value,due:$('d').value+'T'+$('tm').value,done:false});
  save();$('f').reset();$('e').value=30;$('sug').textContent='';setDef();$('addsec').classList.remove('open');render();
});
$('s').addEventListener('input',()=>{
  const a=avg($('s').value.trim());
  if(a){$('e').value=a;$('sug').textContent=`הערכה מותאמת: ${a} דקות, לפי המשימות האחרונות שלך ב${$('s').value.trim()}`}
  else $('sug').textContent='';
});
$('tasks').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=+b.parentElement.dataset.id,t=tasks.find(x=>x.id===id);
  if(b.dataset.a==='focus'){pom={end:Date.now()+25*6e4,mode:'work',name:t.name};return pomUI()}
  if(b.dataset.a==='del'){tasks=tasks.filter(x=>x.id!==id)}
  else{
    const v=await askMin(t);
    if(v===null)return;
    const m=parseInt(v,10);
    if(m>0){(hist[t.sub]=hist[t.sub]||[]).push(m)}
    t.done=true;t.act=m>0?m:t.est;t.doneAt=Date.now();
  }
  save();render();
});
$('clear').onclick=()=>{clear=!clear;$('clear').textContent=clear?'חזרה לתצוגה מלאה':'מצב ריכוז';render()};
$('theme').onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark';store.set('so_theme',r.dataset.theme);
};
const th=store.get('so_theme',null);if(th)document.documentElement.dataset.theme=th;

// Date & time entry: day strip + 24h selects
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function inDays(n){const d=new Date();d.setDate(d.getDate()+n);return d}
let other=false;
for(let i=0;i<21;i++){
  const d=inDays(i),b=document.createElement('button');
  b.type='button';b.className='dy';b.dataset.d=iso(d);
  b.innerHTML=`<small>${i===0?'היום':i===1?'מחר':d.toLocaleDateString('he-IL',{weekday:'short'}).replace('יום ','')}</small><b>${d.getDate()}</b>`;
  b.onclick=()=>{$('d').value=b.dataset.d;$('dh').textContent='';mark()};
  $('dc').appendChild(b);
}
$('th').innerHTML=Array.from({length:24},(_,i)=>`<option>${pad(i)}</option>`).join('');
$('tmm').innerHTML=Array.from({length:12},(_,i)=>`<option>${pad(i*5)}</option>`).join('');
function mark(){
  const v=$('d').value,bs=[...$('dc').children];
  bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===v));
  $('dx').value=bs.some(b=>b.dataset.d===v)?'':v;
  const [h,m]=($('tm').value||'08:00').split(':');
  $('th').value=h;
  if(![...$('tmm').options].some(o=>o.value===m))$('tmm').add(new Option(m,m));
  $('tmm').value=m;
}
$('th').onchange=$('tmm').onchange=()=>{$('tm').value=$('th').value+':'+$('tmm').value};
$('dx').onchange=()=>{if($('dx').value){$('d').value=$('dx').value;$('dh').textContent='';mark()}};
function setDef(){other=false;$('dh').textContent='';$('d').value=iso(inDays(1));$('tm').value='08:00';mark()}
setDef();

// ---- Stage 2: schedule + events ----
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי'];
$('dy').innerHTML=DAYS.map((n,i)=>`<option value="${i}">יום ${n}</option>`).join('');
$('cls').value=store.get('so_cls',(store.get('so_week',null)||{}).class||'');
$('cls').addEventListener('input',()=>store.set('so_cls',$('cls').value));
function loadDay(){$('lt').value=(sched[$('dy').value]||[]).map(l=>l[0]+' '+l[1]).join('\n')}
$('dy').addEventListener('change',()=>{$('sm').textContent='';loadDay()});
$('ss').onclick=()=>{
  const rows=$('lt').value.split('\n').map(l=>l.trim().match(/^(\d{1,2}):(\d{2})\s+(.+)$/)).filter(Boolean).map(m=>[pad(+m[1])+':'+m[2],m[3]]).sort((a,b)=>a[0]<b[0]?-1:1);

function today0(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseEvents(txt){
  const n=new Date(),y0=n.getMonth()>=8?n.getFullYear():n.getFullYear()-1;let out=[];
  txt.split('\n').forEach(l=>{
    const m=l.match(/(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?/);if(!m)return;
    const dd=+m[1],mm=+m[2];if(dd<1||dd>31||mm<1||mm>12)return;
    let yy=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):(mm>=9?y0:y0+1);
    const title=l.replace(m[0],'').replace(/\s+/g,' ').trim();if(!title)return;
    out.push({date:yy+'-'+pad(mm)+'-'+pad(dd),title});
  });
  return out;
}
$('pb').onclick=()=>{
  const f=parseEvents($('pt').value);
  const keys=new Set(evs.map(e=>e.date+e.title));let add=0;
  f.forEach(e=>{if(!keys.has(e.date+e.title)){evs.push(e);add++}});
  evs.sort((a,b)=>a.date<b.date?-1:1);store.set('so_ev',evs);
  $('pm').textContent=add?`נוספו ${add} אירועים`:'לא נמצאו אירועים חדשים. כל שורה צריכה תאריך (כמו 12.10) ושם.';
  if(add)$('pt').value='';render();
};
$('pdf').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  $('pm').textContent='קורא את הקובץ…';
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let out='';
    for(let i=1;i<=doc.numPages;i++){
      const c=await (await doc.getPage(i)).getTextContent(),rows={};
      c.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)});
      Object.keys(rows).sort((a,b)=>b-a).forEach(y=>{out+=rows[y].sort((a,b)=>b.transform[4]-a.transform[4]).map(i=>i.str).join(' ')+'\n'});
    }

    $('pm').textContent='הטקסט נקרא. אפשר לתקן אותו ואז ללחוץ ״הוסף אירועים״.';

});

function notify(t,b){try{if(navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'/icon-192.png'}));return true}new Notification(t,{body:b});return true}catch(e){return false}}
function nstat(){
  if(!('Notification' in window)){$('ns').textContent='הדפדפן הזה לא תומך בהתראות.';return}
  const p=Notification.permission;
  $('nb').textContent=cfg.on&&p==='granted'?'כבה התראות':'הפעל התראות';
  $('ns').textContent=p==='denied'?'ההתראות חסומות בהגדרות הדפדפן.':cfg.on&&p==='granted'?(cfg.push?'התראות פעילות גם כשהאפליקציה סגורה.':'התראות פעילות כל עוד האפליקציה פתוחה בדפדפן.'):'';

$('nb').onclick=async()=>{

  try{const p=await Notification.requestPermission();cfg.on=p==='granted'}catch(e){cfg.on=false}

function fire(k,t,b){if(fired[k])return;fired[k]=1;store.set('so_fired',fired);notify(t,b)}
function tick(){
  if(cfg.push||!cfg.on||!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date(),day=iso(now);
  // morning summary (only within 3 hours of the set time)
  const [mh,mm]=cfg.morning.split(':').map(Number),mt=new Date(now);mt.setHours(mh,mm,0,0);
  if(now>=mt&&now-mt<3*36e5){
    const ls=sched[now.getDay()]||[],top=tasks.filter(t=>!t.done).map(t=>({...t,u:urgency(t)})).sort((a,b)=>b.u-a.u).slice(0,3);
    const evT=evs.filter(e=>e.date===day).map(e=>e.title);
    fire('m'+day,'בוקר טוב'+(store.get('so_name','')?', '+store.get('so_name',''):''),[ls.length?`${ls.length} שיעורים היום`:'אין שיעורים היום',...evT,top.length?'בוער: '+top.map(t=>t.name).join(', '):''].filter(Boolean).join(' · '));
  }
  (sched[now.getDay()]||[]).forEach(l=>{
    const [h,m]=l[0].split(':').map(Number),t=new Date(now);t.setHours(h,m,0,0);
    const diff=(t-now)/6e4;
    if(diff>0&&diff<=cfg.lesson)fire('l'+day+l[0],l[1],`מתחיל בעוד ${Math.ceil(diff)} דקות`);
  });
  tasks.filter(t=>!t.done).forEach(t=>{
    const hrs=(new Date(t.due)-now)/36e5;
    if(hrs>0&&hrs<=cfg.dl+t.est/60)fire('d'+t.id,t.name,`ההגשה בעוד ${hrs<1?Math.round(hrs*60)+' דקות':Math.round(hrs)+' שעות'}. צפוי לקחת ${avg(t.sub)||t.est} דקות`);
  });
}

function renderWeek(){
  const since=Date.now()-7*864e5,done=tasks.filter(t=>t.done&&t.doneAt>=since&&t.act);
  const by={};done.forEach(t=>{const o=by[t.sub]=by[t.sub]||{a:0,e:0};o.a+=t.act;o.e+=t.est});
  const subs=Object.keys(by).map(k=>({k,a:by[k].a,e:by[k].e,r:by[k].a/by[k].e})).sort((x,y)=>y.r-x.r);

  else{
    const hard=subs[0].r>1.15?`<div><b>במה התקשיתי:</b> ${esc(subs[0].k)}, לקח פי ${subs[0].r.toFixed(1)} מהמתוכנן</div>`:'<div><b>במה התקשיתי:</b> בשבוע הזה עמדת בהערכות הזמן.</div>';

    const m30=Date.now()-30*864e5,hardCnt={};
    grades.filter(g=>g.t>=m30&&g.f==='קשה').forEach(g=>hardCnt[g.s]=(hardCnt[g.s]||0)+1);
    Object.keys(hardCnt).filter(k=>hardCnt[k]>=2).forEach(k=>recs.push(`מומלץ להתחיל להתכונן ל${esc(k)} 3 ימים מראש.`));
    $('wk').innerHTML=`<div>${store.get('so_name','')?esc(store.get('so_name',''))+', ':''}<b>${done.length}</b> משימות הושלמו, ${Math.round(done.reduce((x,t)=>x+t.act,0)/6)/10} שעות עבודה</div>`+hard+
      subs.map(x=>`<div><div class="meta">${esc(x.k)}: ${x.a} דק׳ בפועל, ${x.e} מתוכננות</div><div class="trk"><i style="width:${Math.min(100,x.r*50)}%;background:${x.r>1.25?'var(--r)':'var(--g)'}"></i></div></div>`).join('')+

// ---- Real Web Push (works after deploying with the /api functions) ----
function b64(k){const p='='.repeat((4-k.length%4)%4),r=atob((k+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function subscribePush(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window))return;
    const reg=await navigator.serviceWorker.ready;
    const {key}=await (await fetch('/api/vapid')).json();
    if(!key)return;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key)});
    cfg.push=true;store.set('so_cfg',cfg);pushSync(0);
  }catch(e){cfg.push=false}
}
async function unsubPush(){
  try{
    const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){await fetch('/api/subscribe',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe()}
  }catch(e){}
}
let pst=null;
function pushSync(delay){
  if(!cfg||!cfg.push)return;clearTimeout(pst);
  pst=setTimeout(async()=>{
    try{
      const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(!sub)return;
      await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        subscription:sub.toJSON(),cls:$('cls').value.trim(),mine:mine||[],
        cfg:{morning:cfg.morning,lesson:cfg.lesson,dl:cfg.dl,name:store.get('so_name','')},
        tasks:tasks.filter(t=>!t.done).map(t=>({id:t.id,name:t.name,sub:t.sub,est:avg(t.sub)||t.est,due:t.due}))
      })});
    }catch(e){}
  },delay===0?0:1500);
}

// ---- Cross-device sync (code-based, no accounts) ----
let scode=store.get('so_code','');
const nrm=c=>String(c||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const fmtCode=c=>(c.match(/.{1,4}/g)||[]).join('-');
const setSM=t=>{$('scm').textContent=t};
function localData(){const d={};SYNCK.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)d[k]=JSON.parse(v)});return d}
function adopt(data,v){
  SYNCK.forEach(k=>{if(k in data)localStorage.setItem(k,JSON.stringify(data[k]));else localStorage.removeItem(k)});
  localStorage.setItem('so_ver',String(v));localStorage.removeItem('so_dirty');location.reload();
}
let sst=null;
function schedSync(){if(!scode)return;clearTimeout(sst);sst=setTimeout(pushNow,2000)}
async function pushNow(){
  if(!scode)return;
  try{
    const r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:scode,data:localData()})});
    if(r.ok){const j=await r.json();localStorage.setItem('so_ver',String(j.v));localStorage.removeItem('so_dirty');setSM('מסונכרן')}
  }catch(e){}
}
async function pullNow(){
  if(!scode)return;
  try{
    const r=await fetch('/api/sync?code='+scode);
    if(r.status===404){pushNow();return}
    if(!r.ok)return;
    const j=await r.json(),ver=+localStorage.getItem('so_ver')||0;
    if(j.v===ver)return;
    if(localStorage.getItem('so_dirty')){pushNow();return}
    if($('addsec').classList.contains('open')||$('dlg').open)return;
    adopt(j.data||{},j.v);
  }catch(e){}
}
function syncUI(){$('sc_off').hidden=!!scode;$('sc_on').hidden=!scode;if(scode)$('scv').textContent=fmtCode(scode)}
function genCode(){const A='abcdefghjkmnpqrstuvwxyz23456789',b=crypto.getRandomValues(new Uint8Array(32));return [...b].map(x=>A[x%A.length]).join('')}
$('sc1').onclick=async()=>{scode=genCode();store.set('so_code',scode);localStorage.setItem('so_dirty','1');syncUI();setSM('יוצר…');await pushNow()};
$('sc2').onclick=async()=>{
  const c=nrm($('sci').value);if(c.length!==32){setSM('הקוד צריך להכיל 32 תווים');return}
  setSM('מתחבר…');
  try{
    const r=await fetch('/api/sync?code='+c);
    if(r.status===404)return setSM('לא נמצא קוד כזה');
    if(!r.ok)return setSM('החיבור נכשל');
    const j=await r.json();store.set('so_code',c);adopt(j.data||{},j.v);
  }catch(e){setSM('החיבור נכשל')}
};
$('scc').onclick=()=>{try{navigator.clipboard.writeText(fmtCode(scode));setSM('הקוד הועתק')}catch(e){setSM('לא הצלחתי להעתיק. אפשר לסמן ידנית.')}};
$('scx').onclick=()=>{store.set('so_code','');scode='';syncUI();setSM('המכשיר נותק. הנתונים נשארו בו.')};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullNow()});
syncUI();pullNow();
// class suggestions
(async()=>{
  let l=store.get('so_classes',null);
  try{if(!l){const r=await fetch('/api/classes');if(r.ok){l=(await r.json()).classes;store.set('so_classes',l)}}}catch(e){}
  if(l)$('clsl').innerHTML=l.map(x=>`<option value="${esc(x)}">`).join('');
})();
$('nmn').value=store.get('so_name','');
$('nmn').addEventListener('input',()=>{store.set('so_name',$('nmn').value.trim());render();pushSync()});
if(cfg&&cfg.push)pushSync(0);
render();setInterval(render,60000);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
</body>
</html>
